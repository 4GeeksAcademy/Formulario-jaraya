<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <form>
        <div class="row justify-content-center m-2">
            <div class="col-md-10 offset-md-1">
		<!-- form complex example -->
		<div class="card card-outline-secondary">
			<div class="card-header">
				<h3 class="mb-0">Payment form example</h3>
			</div>
            <div class="alert alert-danger m-2 " role="alert">
                Some fields are missing
            </div>
        
                    <div class="form-row m-2">
                        <div class="form-group col-md-6">
                            <label for="card">Card#</label>
                            <input class="form-control" type="text" id="card" name="card" placeholder="XXXXXXX"/>
                        </div>
                        <div class="form-group col-md-3">                        
                            <label for="cvc">CVC #</label>
                            <input class ="form-control" type="text" id="cvc" name="cvc" placeholder="0000"/>
                        </div>
                        <div class="form-group col-md-3">
                            <label for="amount">Amount</label>
                            <input class="form-control" type="text" id="amount" name="amount" placeholder="Amount"/>
                        </div>
                    </div>
        
                    
            
            <div class="form-row m-2">
                <div class="col-md-6">                
                    <label for="fname"> First Name</label>
                    <input class="form-control" type="text" id="fname" name="fname"/>
                </div>
                <div class="col"> 
                    <label for="lname">Last Name</label>
                    <input class="form-control" type="text" id="lname" name="fnamee"/>
                </div>
            </div>

            <div class="form-row m-2">
                <div class="col-6">
                    <label for="city">City</label>
                    <input class="form-control" type="text" name="city" id="city"/>
                </div>
                <div class="col">
                    <label for="state">State</label>
                    <input class="form-control" type="" name="state" id="state"/>
                </div>
                <div class="col">                
                    <label for="state">Postal Code</label>
                    <input class="form-control" type="" name="state" id="state"/>
                </div>
            </div>

            <div class="form-row m-2">
            	<div class="col-md-6 pb-3">
						<p for="exampleAccount">We accept:</p>
						<div class="btn-group" data-toggle="buttons">
							<label class="btn btn-secondary">
								<input autocomplete="off" checked id="blue" name="options" type="radio">
								<i class="fab fa-cc-mastercard"></i>
							</label> 
							<label class="btn btn-secondary">
								<input autocomplete="off" id="red" name="options" type="radio">
								<i class="fab fa-cc-visa"></i>
							</label> 
							<label class="btn btn-secondary">
								<input autocomplete="off" id="green" name="options" type="radio">
								<i class="fab fa-cc-diners-club"></i>
							</label> 
							<label class="btn btn-secondary">
								<input autocomplete="off" id="yellow" name="options" type="radio">
								<i class="fab fa-cc-amex"></i>
							</label> 
						</div>
                </div>
                    <div class="col-md-6">
                        <label for="msn">Message</label>
                         <textarea class="form-control" name="msn" id="msn"></textarea>
                    </div>
                 </div>

                 
                <div class="card-header">
                    <div class="float-right">
                        <button type="button" class="btn btn-secondary">Cancelar</button>
                        <button type="button" class="btn btn-primary">Send</button>
                </div>

					
            

           

             </div>

          



    
        
    </form>

    
    
</body>
</html>
